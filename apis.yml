aid: upequity
name: UpEquity
description: 'UpEquity is an Austin, Texas based, veteran-owned proptech mortgage lender
  and title company founded in 2019 that operates a "Buy Before You Sell" / Trade Up program
  for homeowners who are purchasing and selling at the same time. The company advances the
  equity trapped in a client''s existing home so the client can make a non-contingent — effectively
  all-cash — offer on a new home, move once, and sell the old home afterward, with UpEquity
  making a backup offer on the departing residence. It also runs UpEquity Title and originates
  mortgages directly under NMLS #2101265, licensed across roughly twenty US states. Distribution
  is through real-estate agents and loan officers rather than a developer channel: as of this
  profiling pass UpEquity publishes no developer portal, no API reference, and no machine-readable
  API contract of any kind on any host it controls.'
